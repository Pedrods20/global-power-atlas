name: CI

on:
  push:
    branches: [main]
    # A prospective ledger commit does not change the static site or the
    # canonical observations. Its own workflow validates the isolated inputs;
    # avoid rebuilding and redeploying the monthly dashboard for every issue.
    paths-ignore:
      - "data/forecast_issues/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        # pyproject sets mypy to strict. Running it here is what stops that
        # setting from being decorative: it went unenforced long enough for two
        # adapters to be merged with no annotations at all.
        run: mypy

      - name: Test
        # The suite runs entirely against recorded fixtures, mocked HTTP
        # transports and temporary directories, so it needs no credentials and
        # makes no network calls.
        #
        # The floor is global rather than per-module. Adapter `fetch` methods
        # are an I/O boundary: their testable logic (parsing, fuel mapping,
        # timezone conversion) is extracted into pure functions that fixtures
        # already cover, and the retry and throttle behaviour they all share is
        # tested once in sources/base.py. What stays uncovered is the sequence
        # of HTTP calls, and mocking seven providers to exercise it would buy
        # very little. Raise this number when it becomes easy to, never lower
        # it to make a change pass.
        run: pytest -q --cov=gpa --cov-fail-under=75

      - name: Validate the committed store
        # Catches a partition written by an older adapter, hand-edited, or
        # left half-written by an interrupted run.
        run: gpa validate

      - name: Audit structural coverage
        # Schema validity is not the same claim as gap-free time coverage:
        # this catches overlapping observations and internal missing time per
        # zone, dataset and fuel that a schema-only check would miss.
        run: gpa audit

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -e .
      - run: npm ci

      - name: Fail if the exported tables are stale
        run: gpa export --check

      - run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke against the local preview
        # Started and stopped inside one step: a server backgrounded here would
        # not reliably survive into a later step on the runner.
        env:
          GPA_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          npm run dev &
          server=$!
          ready=
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "preview server did not become ready"
            kill "$server" 2>/dev/null || true
            exit 1
          fi
          set +e
          npm run test:browser
          status=$?
          set -e
          kill "$server" 2>/dev/null || true
          exit $status

  deploy:
    name: Deploy
    needs: [python, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
