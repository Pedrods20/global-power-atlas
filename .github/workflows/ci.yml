name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        # The suite runs entirely against recorded fixtures and temporary
        # directories, so it needs no credentials and makes no network calls.
        run: pytest -q

      - name: Validate the committed store
        # Catches a partition written by an older adapter, hand-edited, or
        # left half-written by an interrupted run.
        run: gpa validate

  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -e .
      - run: npm ci

      - name: Rebuild site tables from the committed store
        run: gpa export

      - name: Fail if the exported tables are stale
        # The export is deterministic given the store, so a diff here means
        # site/data was committed without being regenerated.
        run: |
          if ! git diff --quiet -- site/data; then
            echo "site/data is out of date. Run 'gpa export' and commit the result."
            git diff --stat -- site/data
            exit 1
          fi

      - run: npm run build
