name: Deploy

# Bot pushes do not trigger another push workflow. A successful Ingest run
# explicitly triggers deployment of the latest committed main branch.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Ingest]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -e .
      - run: npm ci

      - name: Rebuild site tables from the committed store
        run: gpa export

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          # A project page is served under /<repo>/, so assets must resolve
          # there rather than at the domain root.
          GPA_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
