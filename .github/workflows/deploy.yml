name: Deploy

# Publishes one exact commit. It is never triggered by a push on its own:
#
# - CI calls it after lint, types, tests, the export check, the site build and
#   the browser smoke test have all passed for the pushed commit;
# - Ingest calls it with the data commit that run created, so new observations
#   reach the site even when a later freshness check reports a stale feed;
# - a manual dispatch deploys the ref chosen in the UI.
#
# Checking out the given SHA rather than moving `main` is what makes a green
# deployment evidence that this revision, and not a later one, was validated.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to publish"
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -e .
      - run: npm ci

      - name: Refuse stale site tables
        # The committed tables are what CI or Ingest validated. Rebuilding them
        # here would publish something nobody checked.
        run: gpa export --check

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          # A project page is served under /<repo>/, so assets must resolve
          # there rather than at the domain root.
          GPA_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
