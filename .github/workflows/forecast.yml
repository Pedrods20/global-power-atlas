name: Forecast

# The historical dashboard remains monthly. This job is separate because a
# prospective forecast has to be issued on the market clock, then reconciled
# after the delivery price is observable.

on:
  schedule:
    # DE-LU's gate is 12:00 local market time on D-1: 10:00Z under CEST, 11:00Z
    # under CET. GitHub's scheduled workflows are best-effort, and in this
    # repository "best-effort" has meant hours: the old 09:30Z cron arrived
    # between 13:14Z and 15:57Z, and on 23 September 2026 the 02:17Z and 06:47Z
    # slots arrived at 07:49Z and 12:17Z, both about five and a half hours late.
    # The slots are therefore placed by their likely arrival, not their nominal
    # time. 23:17Z is the primary: already D-1 in market time in both seasons
    # (01:17 CEST, 00:17 CET), and landing near 05:00Z at the observed delay.
    # 02:17Z is the backstop, landing near 08:00Z. 06:47Z usually lands after
    # the gate and exists for days the scheduler runs close to time. Nothing
    # needed is unavailable this early: D-1's own prices cleared in D-2's
    # auction.
    #
    # Running three times a day is safe by design. `gpa issue` first looks for
    # the day's canonical issue -- the earliest complete, verified pre-gate one
    # per model and delivery day -- and a later slot that finds it records its
    # attempt as `already_issued` and exits 0 without reissuing. A late slot
    # that finds nothing still fails, so a red run means a missing day, not a
    # redundant one. An abstained or partial issue is not canonical, so a later
    # pre-gate slot retries it.
    #
    # `ridge` issues from the published information set and `ridge_da` from
    # that set plus the operators' day-ahead forecasts: separate frozen
    # identities, scored against each other. Whether `ridge_da` can ever issue
    # is an open question. It found nothing to read at 05:45 CEST on 16
    # September and at 09:49 CEST on 23 September, and Regulation (EU)
    # 543/2013 only requires day-ahead wind and solar forecasts by 18:00 on
    # D-1, after the gate. probe.yml measures when the series actually appears.
    - cron: "17 23 * * *"
    - cron: "17 2 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The public store and monthly site exports stay untouched. The forecast
      # run receives the committed history as a seed and catches it up from
      # the seed's own checkpoint before reconciliation and issuance, so a
      # stale monthly seed is recovered rather than capped at a fixed window.
      GPA_DATA_ROOT: /tmp/gpa-curated
      # The published information set, and the arm the retrospective release
      # already describes. It must always issue; the job fails if it does not.
      FORECAST_MODEL: ridge
      # The same estimator on a wider information set, run beside it as the
      # experiment that settles whether the fundamentals earn a place. It may
      # abstain without failing the run: see the issue step below.
      FORECAST_MODEL_DA: ridge_da
      # The comparators the forecast's value is claimed over. Issued at the same
      # gate on the same inputs, so the prospective record can score the claim
      # the retrospective release makes instead of reconstructing them later.
      FORECAST_COMPARATORS: "naive_previous_day naive_previous_week naive_similar_day"
      # Revision overlap behind that checkpoint, not the length of the refresh.
      FORECAST_LOOKBACK: "7"
      FORECAST_DELIVERY_DATE: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Register this run as a tracked attempt before any refresh
        # A setup or ingestion failure below must still leave local evidence
        # that this scheduled slot was attempted, not silently absent. One
        # attempt per arm: they finish independently, so an abstaining
        # fundamentals arm never closes the published arm's record.
        run: |
          ATTEMPT_ID="gh-${{ github.run_id }}-${{ github.run_attempt }}"
          ATTEMPT_ID_DA="$ATTEMPT_ID-da"
          echo "ATTEMPT_ID=$ATTEMPT_ID" >> "$GITHUB_ENV"
          echo "ATTEMPT_ID_DA=$ATTEMPT_ID_DA" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ORIGIN=workflow_dispatch
          else
            ORIGIN=schedule
          fi
          pairs="$ATTEMPT_ID:$FORECAST_MODEL $ATTEMPT_ID_DA:$FORECAST_MODEL_DA"
          for model in $FORECAST_COMPARATORS; do
            pairs="$pairs $ATTEMPT_ID-$model:$model"
          done
          for pair in $pairs; do
            id="${pair%%:*}"
            model="${pair##*:}"
            if [ -n "$FORECAST_DELIVERY_DATE" ]; then
              gpa forecast-attempt start --attempt-id "$id" --zone DE-LU \
                --model "$model" --origin "$ORIGIN" --delivery-date "$FORECAST_DELIVERY_DATE"
            else
              gpa forecast-attempt start --attempt-id "$id" --zone DE-LU \
                --model "$model" --origin "$ORIGIN"
            fi
          done

      - name: Seed an isolated forecast store
        run: |
          mkdir -p "$GPA_DATA_ROOT"
          cp -a data/curated/. "$GPA_DATA_ROOT/"

      - name: Refresh the DE-LU forecast inputs
        # Prices are requested past now: D-1's whole curve is public before
        # this morning run, and the panel drops an incomplete D-1 entirely.
        run: gpa ingest --zone DE-LU --days "$FORECAST_LOOKBACK"

      - name: Validate the isolated inputs
        run: gpa validate

      - name: Reconcile previously issued forecasts
        run: gpa reconcile --zone DE-LU

      - name: Evaluate reconciled battery dispatch
        run: gpa battery --zone DE-LU --output data/forecast_issues/evaluations

      - name: Issue the published information set before the market gate
        # Reuses the attempt registered above; its delivery date and origin
        # carry over, so a late or failed issue still finalizes the same
        # tracked attempt instead of leaving it open.
        run: gpa issue --zone DE-LU --model "$FORECAST_MODEL" --attempt-id "$ATTEMPT_ID"

      - name: Issue the day-ahead fundamentals arm beside it
        # `gpa issue` exits non-zero on anything but a complete issue, and this
        # arm abstains by design whenever the provider has not published the
        # delivery day in time. That abstention is the experiment's evidence,
        # not a fault: the commit step below records it either way and the
        # attempt carries its status. Failing the job on it would make an honest
        # abstention indistinguishable from a broken run, and would hide it
        # behind a red cross on days the published arm succeeded. The published
        # arm above is the one that gates this job.
        continue-on-error: true
        run: gpa issue --zone DE-LU --model "$FORECAST_MODEL_DA" --attempt-id "$ATTEMPT_ID_DA"

      - name: Issue the naive comparators on the same inputs
        # After the fundamentals arm, so a comparator failure never costs that
        # arm its attempt. Like the published arm, these must issue: without
        # them the prospective record cannot test the value claimed for it.
        run: |
          for model in $FORECAST_COMPARATORS; do
            gpa issue --zone DE-LU --model "$model" --attempt-id "$ATTEMPT_ID-$model"
          done

      - name: Record a failed attempt if an earlier step never completed it
        # gpa issue always finalizes its own attempt, so --if-open is a no-op
        # there; this only closes attempts left open by an earlier failure
        # (ingest, validate, reconcile, battery or an earlier issue).
        if: failure()
        run: |
          # Nothing was registered if the registration step itself failed.
          if [ -z "$ATTEMPT_ID" ]; then
            exit 0
          fi
          ids="$ATTEMPT_ID $ATTEMPT_ID_DA"
          for model in $FORECAST_COMPARATORS; do
            ids="$ids $ATTEMPT_ID-$model"
          done
          for id in $ids; do
            gpa forecast-attempt finish --attempt-id "$id" --status failed --if-open
          done

      - name: Commit the prospective ledger
        # Runs even after an earlier failure so failed-attempt evidence is
        # preserved; the job's own conclusion still reports that failure.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_issues
          if git diff --cached --quiet; then
            echo "No new issue or attempt records; nothing to commit."
            exit 0
          fi
          # The run's own clock, not the delivery day: one delivery day is now
          # attempted by up to three runs, some of them on the previous UTC date.
          git commit -m "forecast: DE-LU run at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
