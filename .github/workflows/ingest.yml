name: Ingest

# The engine that accumulates history. Runs daily, refetches a trailing window
# rather than only yesterday because providers publish on a lag and revise
# afterwards, and commits the resulting Parquet. The store upserts on each
# dataset's natural key, so overlapping runs converge on the restated figures
# instead of duplicating them.

on:
  schedule:
    # 05:40 UTC. Late enough that the European and Australian previous day is
    # settled, early enough to be well clear of the hour boundary when every
    # other scheduled job on GitHub fires.
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Trailing days to refetch"
        required: false
        default: "7"

permissions:
  contents: write
  issues: write

concurrency:
  # Never let two ingests write the store at once; a queued run would commit on
  # top of a half-written tree.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Ingest
        # Every registered zone is sourced from Energy-Charts or ONS, neither
        # of which needs a credential, so no zone list or secret is passed.
        run: gpa ingest --days ${{ github.event.inputs.days || '7' }}

      - name: Validate
        run: gpa validate

      - name: Audit structural coverage
        # Catches overlapping observations and internal missing time per zone,
        # dataset and fuel, which schema validation alone would not catch.
        # Runs before commit, unlike freshness: an integrity problem should
        # block persistence, not just staleness.
        run: gpa audit

      - name: Refresh fuel, carbon and FX references
        run: gpa benchmarks

      - name: Rebuild site tables
        run: gpa export

      - name: Report coverage
        run: gpa stats

      # Committing comes before the freshness check on purpose. Whatever was
      # fetched successfully should be persisted even when one feed has gone
      # quiet; otherwise a single stale provider would discard a whole day of
      # good observations from every other market.
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated data/reference site/data
          if git diff --cached --quiet; then
            echo "No new observations; nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: ingest $(date -u +%Y-%m-%d)"
          # Another run, or a push to main, may have landed while this one was
          # fetching. Rebasing keeps the data history linear.
          git pull --rebase --autostash origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check freshness
        # A run that fetched nothing still exits zero if no adapter raised, so
        # without this a provider could go dark for a week while the site kept
        # serving last week's numbers as current. Rules are per zone and
        # dataset because providers publish at genuinely different speeds; see
        # src/gpa/freshness.py for each threshold and the reason behind it.
        run: gpa freshness

      - name: Open an issue when the run fails
        # Last, so that a failure in any earlier step reaches it, including the
        # commit and push. The badge alone is easy to miss; an issue is
        # visible, assignable and carries the log link. Repeated failures
        # comment on the open issue rather than filing a new one every night.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled ingest did not complete.',
              '',
              `Run: ${run}`,
              '',
              'A freshness failure means a provider stopped publishing rather than',
              'that the code broke. The rule that fired names the zone, the dataset',
              'and the reason its limit is what it is.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ingest-failure',
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ingest failed on ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['ingest-failure'],
              });
            }

  deploy:
    needs: ingest
    # Runs whenever the commit step pushed new data, even if the later
    # freshness check failed: a quiet provider should not hold back the
    # observations every other market published successfully.
    if: ${{ !cancelled() && needs.ingest.outputs.committed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.ingest.outputs.sha }}
