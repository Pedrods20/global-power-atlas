[project]
name = "global-power-atlas"
version = "0.1.0"
description = "German power market research: DE-LU day-ahead price shape, forecasting and battery arbitrage value."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Cabral" }]
keywords = ["electricity", "power-markets", "day-ahead", "battery-storage", "energy-charts", "forecasting"]

dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "typer>=0.12",
    "pandera[polars]>=0.20",
    # zoneinfo has no tz database to read on Windows, and a slim Linux CI image
    # may not ship one either. Depending on tzdata makes market-time handling
    # deterministic across every platform this runs on.
    "tzdata>=2024.1",
    "lightgbm>=4.6,<5",
    # Keep annotations compatible with the declared Python 3.11 mypy target.
    "numpy>=2.1,<2.3",
]

[project.optional-dependencies]
tracking = ["mlflow>=3.1,<4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gpa = "gpa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
packages = ["gpa"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
